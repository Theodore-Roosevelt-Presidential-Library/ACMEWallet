trpl_wallet.settings:
  type: config_object
  label: 'Wallet pass settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enabled'
    delivery_mode:
      type: string
      label: 'Delivery mode'
    pass_page_url:
      type: uri
      label: 'Pass page URL'
    allowed_origins:
      type: sequence
      label: 'Allowed origins'
      sequence:
        type: string
    organization_name:
      type: label
      label: 'Organization name'
    acme:
      type: mapping
      label: 'ACME'
      mapping:
        base_url:
          type: uri
          label: 'API base URL'
        tenant_id:
          type: string
          label: 'Tenant ID'
    apple:
      type: mapping
      label: 'Apple Wallet'
      mapping:
        pass_type_identifier:
          type: string
          label: 'Pass Type ID'
        team_identifier:
          type: string
          label: 'Team ID'
        background_color:
          type: string
          label: 'Background color'
        foreground_color:
          type: string
          label: 'Text color'
        label_color:
          type: string
          label: 'Label color'
        latitude:
          type: string
          label: 'Latitude'
        longitude:
          type: string
          label: 'Longitude'
        relevant_text:
          type: label
          label: 'Lock screen text'
        terms_url:
          type: string
          label: 'Terms URL'
    google:
      type: mapping
      label: 'Google Wallet'
      mapping:
        issuer_id:
          type: string
          label: 'Issuer ID'
        logo_url:
          type: string
          label: 'Logo URL'
        hero_image_url:
          type: string
          label: 'Hero image URL'
        background_color:
          type: string
          label: 'Background color'
        venue_name:
          type: label
          label: 'Venue name'
        venue_address:
          type: label
          label: 'Venue address'
    limits:
      type: mapping
      label: 'Limits'
      mapping:
        per_ip:
          type: integer
          label: 'Lookups per IP'
        per_number:
          type: integer
          label: 'Lookups per number'
        window_seconds:
          type: integer
          label: 'Window in seconds'
        pass_token_seconds:
          type: integer
          label: 'Pass link lifetime'
        link_token_seconds:
          type: integer
          label: 'Emailed link lifetime'
