# Off until the secrets are installed and a test pass has scanned at the door.
enabled: false
# "email" sends a one-time link to the address on the order (recommended).
# "instant" returns the passes straight to the browser.
delivery_mode: email
# Page that hosts the embed and lists the passes when opened with ?t=<token>.
pass_page_url: 'https://wallet.labs.trlibrary.com/'
# Sites allowed to call the lookup API from a browser.
allowed_origins:
  - 'https://wallet.labs.trlibrary.com'
  - 'https://www.trlibrary.com'
organization_name: 'Theodore Roosevelt Presidential Library'
acme:
  base_url: 'https://api.acmeticketing.com'
  tenant_id: '613'
# Brand colors, one background per pass kind (visual identity guide):
# tickets Night Sky with Gray Sky labels, memberships Dark Forest with Sand.
colors:
  ticket:
    background: '#092A4D'
    foreground: '#FFFFFF'
    label: '#99ADC5'
  membership:
    background: '#1B4532'
    foreground: '#FFFFFF'
    label: '#D1CCBD'
apple:
  pass_type_identifier: ''
  team_identifier: ''
  # The Library's map pin (3410 Chateau Road). Move to the entrance door if
  # passes surface too early or too late on arrival.
  latitude: '46.9174334'
  longitude: '-103.5492931'
  # The one line iPhone shows on the lock screen near the Library.
  relevant_text: 'Your pass is ready to scan.'
  terms_url: 'https://www.trlibrary.com/tickets/terms'
google:
  issuer_id: ''
  # Google shows the logo in a circle. Built by scripts/build_pass_art.py.
  logo_urls:
    ticket: 'https://wallet.labs.trlibrary.com/assets/img/google-logo-ticket.png'
    membership: 'https://wallet.labs.trlibrary.com/assets/img/google-logo-membership.png'
  # Optional wide photo (1032x336) across the pass. Use a cleared image from
  # the Library's asset library.
  hero_image_urls:
    ticket: ''
    membership: ''
  venue_name: 'Theodore Roosevelt Presidential Library'
  venue_address: '3410 Chateau Road, Medora, North Dakota 58645'
limits:
  # Lookups allowed per visitor IP address in each window.
  per_ip: 10
  # Lookups allowed per order or membership number in each window.
  per_number: 5
  window_seconds: 900
  # How long an "Add to Wallet" button stays valid after it is shown.
  pass_token_seconds: 900
  # How long an emailed link stays valid.
  link_token_seconds: 86400
