name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "fivejars/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          # Only the public pages are published. The fivejars folder is code
          # for www.trlibrary.com and is not part of this site.
          mkdir -p _site
          cp -r index.html embed.js CNAME .nojekyll assets preview _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
