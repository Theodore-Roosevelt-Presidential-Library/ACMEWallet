name: Tests

on:
  push:
    paths: ["fivejars/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["fivejars/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fivejars/trpl_wallet
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: openssl, zip
          coverage: none
      # No secrets: tests run on fake ACME data and a throwaway certificate.
      - run: composer install --no-interaction --no-progress
      - run: composer test
