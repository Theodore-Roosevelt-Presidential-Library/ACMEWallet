<!-- Wallet badges for the ticket and membership confirmation emails.
     Table layout and PNG images, because many email clients drop SVG and
     modern CSS. Change WALLET_PAGE_URL if the lookup lives somewhere else. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:16px 0">
  <tr>
    <td colspan="2" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#25282A;padding:0 8px 4px 8px">
      Save this to a phone. Have the order number and this email address ready.
    </td>
  </tr>
  <tr>
    <td style="padding:8px">
      <a href="https://www.trlibrary.com/wallet">
        <img src="https://wallet.labs.trlibrary.com/assets/badges/apple/add-to-apple-wallet.png"
             alt="Add to Apple Wallet" height="48" style="display:block;height:48px;width:auto;border:0">
      </a>
    </td>
    <td style="padding:8px">
      <a href="https://www.trlibrary.com/wallet">
        <img src="https://wallet.labs.trlibrary.com/assets/badges/google/enUS_add_to_google_wallet_wallet-button.png"
             alt="Add to Google Wallet" height="48" width="272" style="display:block;height:48px;width:272px;border:0">
      </a>
    </td>
  </tr>
</table>
